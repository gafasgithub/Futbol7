<!doctype html>
<meta charset="utf-8">
<title>Pruebas de la interfaz</title>
<!-- Abre la web en un iframe y simula clics. Con Edge headless hace falta --allow-file-access-from-files. -->
<pre id="salida">ejecutando…</pre>
<iframe id="web" style="width:1200px;height:900px"></iframe>
<script>
const lineas = []; let fallos = 0;
const comprobar = (ok, texto) => { lineas.push((ok ? 'OK    ' : 'FALLO ') + texto); if (!ok) fallos++; };
const espera = ms => new Promise(r => setTimeout(r, ms));
const marco = document.getElementById('web');
(async () => {
  try {
    localStorage.removeItem('futbol7.v1');
    marco.src = '../index.html#jugadores';
    await new Promise(r => marco.onload = r);
    const w = marco.contentWindow, d = w.document;
    for (let i = 0; i < 50 && !d.querySelector('.ficha'); i++) await espera(100);
    const fichas = [...d.querySelectorAll('.ficha')];
    comprobar(fichas.length > 16, `se pintan los jugadores (${fichas.length})`);
    fichas.slice(0, 17).forEach(f => d.querySelector(`.ficha[data-id="${f.dataset.id}"]`).click());
    comprobar(d.querySelectorAll('.ficha.elegida').length === 16, 'no deja pasar de 16');
    const crear = d.getElementById('crear');
    comprobar(!crear.disabled, 'botón "Crear convocatoria" habilitado con 16');
    crear.click();
    await espera(300);
    comprobar(!d.getElementById('equipos').hidden && d.querySelectorAll('.hueco').length === 16, 'crea los equipos (16 huecos)');
    const nombre = (l, i) => d.querySelector(`.hueco[data-lado="${l}"][data-i="${i}"] .hueco-nombre`).textContent;
    const a0 = nombre('A', 0), b3 = nombre('B', 3);
    d.querySelector('.hueco[data-lado="A"][data-i="0"]').click();
    d.querySelector('.hueco[data-lado="B"][data-i="3"]').click();
    comprobar(nombre('A', 0) === b3 && nombre('B', 3) === a0, `intercambio entre equipos (${a0} <-> ${b3})`);
    comprobar(d.querySelector('#equipos .sub').textContent.includes('retocada'), 'marca la convocatoria como retocada');
    d.querySelector('.hueco[data-lado="A"][data-i="1"]').click();
    const sel = d.getElementById('sustituto');
    sel.value = sel.options[1].value;
    sel.dispatchEvent(new Event('change', { bubbles: true }));
    comprobar(nombre('A', 1) === sel.options[1].textContent.split(' · ')[0], 'sustituir por un no convocado');
    const guardado = JSON.parse(localStorage.getItem('futbol7.v1'));
    comprobar(guardado.convocatoria.equipos.A[1].id === Number(sel.options[1].value) && guardado.seleccion.includes(Number(sel.options[1].value)), 'se guarda el cambio y la selección lo sigue');
    w.confirm = () => true;
    const whatsapp = w.textoWhatsApp();
    comprobar(!/media|\d,\d/.test(whatsapp) && whatsapp.includes('Amarillo') && whatsapp.includes('Negro'), 'el texto de WhatsApp no lleva medias');
    d.querySelector('[data-accion="otra"]').click();
    comprobar(d.querySelector('#equipos .sub').textContent.includes('opción 2'), '"Otra opción" pasa a la 2');
    d.querySelector('[data-pestana="condicionantes"]').click();
    const f = d.getElementById('nuevo-cond');
    f.a.value = f.a.options[1].value; f.b.value = f.b.options[2].value; f.tipo.value = 'juntar';
    f.querySelector('[type=submit]').click();
    comprobar(d.querySelectorAll('.cond').length === 1, 'añade un condicionante');
    const f2 = d.getElementById('nuevo-cond');
    f2.a.value = f2.a.options[2].value; f2.b.value = f2.b.options[1].value; f2.tipo.value = 'separar';
    f2.querySelector('[type=submit]').click();
    comprobar(d.querySelectorAll('.cond').length === 1 && d.querySelector('.cond.tipo-separar'), 'la misma pareja no se duplica (se sustituye)');
    comprobar(d.querySelector('#tarjeta-fichero.pendiente'), 'avisa de cambios pendientes de subir al fichero');
    // El fichero que se descarga se puede volver a leer y trae la regla.
    const leido = {};
    new Function('window', w.contenidoFichero())(leido);
    const regla = leido.CONDICIONANTES.condicionantes[0];
    comprobar(leido.CONDICIONANTES.condicionantes.length === 1 && regla.tipo === 'separar' && regla.nombreA, 'el fichero descargado es válido');
    // Si el fichero publicado ya coincide con los cambios, deja de estar pendiente.
    w.CONDICIONANTES = leido.CONDICIONANTES;
    w.pintarCondicionantes();
    w.sincronizarConFichero();
    comprobar(!w.eval('estado.cambiosLocales'), 'al subir el fichero los cambios dejan de estar pendientes');
    // Un fichero con un id que ya no existe encuentra al jugador por su nombre.
    w.CONDICIONANTES = { condicionantes: [{ tipo: 'juntar', a: 99999, b: regla.b, nombreA: regla.nombreA }] };
    comprobar(w.leerFichero().condicionantes[0]?.a === regla.a, 'busca por nombre si el id no existe');
    w.CONDICIONANTES = leido.CONDICIONANTES;
    w.pintarCondicionantes();
    d.querySelector('[data-borrar]').click();
    comprobar(d.querySelector('#tarjeta-fichero.pendiente'), 'borrar una regla del fichero vuelve a dejarlo pendiente');
    d.querySelector('[data-accion="descartar"]').click();
    comprobar(d.querySelectorAll('.cond').length === 1 && d.querySelector('.estado-fichero.al-dia'), '"Descartar" vuelve a lo del fichero');

    // "Siempre en el equipo Amarillo": se oculta el jugador 2 y se guarda con su lado.
    const f3 = d.getElementById('nuevo-cond');
    f3.tipo.value = 'equipo-A';
    f3.tipo.dispatchEvent(new Event('change', { bubbles: true }));
    comprobar(f3.b.hidden, 'con "siempre en el equipo" se oculta el jugador 2');
    const enCampo = w.eval('estado.convocatoria.equipos.B[0].id');
    f3.a.value = String(enCampo);
    f3.querySelector('[type=submit]').click();
    const fija = w.eval("estado.condicionantes.find(c => c.tipo === 'equipo')");
    comprobar(fija && fija.a === enCampo && fija.lado === 'A', 'se guarda "siempre en Amarillo"');
    comprobar(d.querySelector('.cond.tipo-equipo .etiqueta.incumple'), 'avisa de que no se cumple (está en Negro)');
    const releido = {};
    new Function('window', w.contenidoFichero())(releido);
    comprobar(releido.CONDICIONANTES.condicionantes.some(c => c.tipo === 'equipo' && c.lado === 'A' && c.a === enCampo), 'el fichero guarda "siempre en el equipo"');
    d.querySelector('[data-accion="aplicar"]').click();
    comprobar(w.eval('estado.convocatoria.equipos.A').some(h => h.id === enCampo), 'al regenerar pasa al Amarillo');

    // Recargar los datos de fut7-puntuaciones.
    d.querySelector('[data-pestana="jugadores"]').click();
    d.getElementById('recargar').click();
    for (let i = 0; i < 80 && !/recargados|No se pudo/.test(d.getElementById('aviso').textContent); i++) await espera(100);
    comprobar(/Datos recargados/.test(d.getElementById('aviso').textContent), `recargar datos (${d.getElementById('aviso').textContent})`);
    comprobar(d.querySelectorAll('.ficha').length > 16 && JSON.parse(localStorage.getItem('futbol7.jugadores')).jugadores.length > 16, 'tras recargar se ven y se guardan los jugadores');
  } catch (e) { comprobar(false, 'error: ' + e.message); }
  lineas.unshift(fallos ? `${fallos} FALLOS` : 'TODO OK');
  document.getElementById('salida').textContent = lineas.join('\n');
})();
</script>
