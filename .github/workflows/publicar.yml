name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:      # botón para lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Refresca la copia de respaldo de los jugadores; si la fuente no responde, se queda la del repo.
      - name: Actualizar copia de jugadores
        run: python actualizar_jugadores.py || echo "No se pudo actualizar; se publica la copia anterior."

      - name: Preparar la web
        run: |
          mkdir -p _site
          cp -r index.html css js datos img _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: desplegar
